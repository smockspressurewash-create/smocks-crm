# Alfred Cockpit, 24/7.
#
# Every 15 minutes this checks the owner's Alfred Cockpit board (the CRM's
# private request page). Most runs see an empty queue and finish in seconds.
# When there are open items, it runs Claude Code with the /cockpit procedure
# (.claude/commands/cockpit.md): fix, verify, push to master (Cloudflare
# deploys), and post notes back to the board.
#
# Claude runs on a Claude Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN
# (created once with `claude setup-token`) — no API credits.
#
# Repository secrets needed:
#   CLAUDE_CODE_OAUTH_TOKEN  — from `claude setup-token`
#   COCKPIT_SYNC_KEY         — same value as the Cloudflare env var
#
# Run it right now from GitHub: Actions → Alfred Cockpit → Run workflow.

name: Alfred Cockpit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: alfred-cockpit
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the queue
        id: queue
        env:
          KEY: ${{ secrets.COCKPIT_SYNC_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "COCKPIT_SYNC_KEY secret is missing"; exit 1; fi
          body=$(curl -sf -H "x-cockpit-key: $KEY" https://smocks-crm.pages.dev/api/cockpit-sync) || { echo "Cockpit endpoint unreachable"; exit 1; }
          open=$(echo "$body" | jq '.items | length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          echo "Open cockpit items: $open"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.open != '0'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.open != '0'
        with:
          node-version: 20
          cache: npm

      - name: Prepare workspace
        if: steps.queue.outputs.open != '0'
        env:
          KEY: ${{ secrets.COCKPIT_SYNC_KEY }}
        run: |
          npm ci
          mkdir -p .secrets && printf '%s' "$KEY" > .secrets/cockpit-key
          git config user.name "smockspressurewash-create"
          git config user.email "smockspressurewash@gmail.com"

      - name: Work the queue with Claude
        if: steps.queue.outputs.open != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .claude/commands/cockpit.md exactly to work the Alfred Cockpit queue.
            You are running unattended in GitHub Actions on the master branch; git is configured.
            Commit with a clear message ending in "Co-Authored-By: Claude <noreply@anthropic.com>" and `git push origin master` after each verified fix.
            Skip Playwright UI checks if a browser isn't available; say so in the item's note.
          claude_args: >-
            --max-turns 120
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
