<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88">
  <defs>
    <linearGradient id="cb-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="88" height="88" rx="19.25" fill="url(#cb-g)"/>
  <!-- Arms, drawn first so the body/head silhouette overlaps their shoulder
       joint cleanly. Angle down-and-out to a hand resting just under each
       letter, like holding a sign up from below. Canvas widened from 64 to
       88 (vs. just repositioning within 64) specifically so the letters
       have room to sit farther from the body AND get bigger without their
       edges clipping against the icon's own bounds. -->
  <g stroke="#ffffff" stroke-width="8.9" stroke-linecap="round">
    <path d="M34 42 L12 58" fill="none"/>
    <path d="M54 42 L76 58" fill="none"/>
  </g>
  <circle cx="12" cy="58" r="5.8" fill="#ffffff"/>
  <circle cx="76" cy="58" r="5.8" fill="#ffffff"/>
  <!-- Flat rounded mascot silhouette (narrow, matching the reference avatar
       style), sized to leave room for the large C/B on either side -->
  <circle cx="44" cy="22" r="8.9" fill="#ffffff"/>
  <path d="M31.6 63.3 C31.6 45.4 37.1 38.5 44 38.5 C50.9 38.5 56.4 45.4 56.4 63.3 C56.4 70.1 50.9 72.9 44 72.9 C37.1 72.9 31.6 70.1 31.6 63.3 Z" fill="#ffffff"/>
  <!-- Large, high-contrast C and B, pushed out to the edges of the widened
       canvas and bigger than before, still resting on the hands -->
  <text x="12" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">C</text>
  <text x="76" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle">B</text>
</svg>
