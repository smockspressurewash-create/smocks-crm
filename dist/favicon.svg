<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cb-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cb-g)"/>
  <!-- Arms, drawn first so the body/head silhouette overlaps their shoulder
       joint cleanly. Angle down-and-out to a hand resting just under each
       letter, like holding a sign up from below. -->
  <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round">
    <path d="M25 34 L13 44" fill="none"/>
    <path d="M39 34 L51 44" fill="none"/>
  </g>
  <circle cx="12" cy="45" r="4.2" fill="#ffffff"/>
  <circle cx="52" cy="45" r="4.2" fill="#ffffff"/>
  <!-- Flat rounded mascot silhouette (narrow, matching the reference avatar
       style), sized to leave room for the large C/B on either side -->
  <circle cx="32" cy="16" r="6.5" fill="#ffffff"/>
  <path d="M23 46 C23 33 27 28 32 28 C37 28 41 33 41 46 C41 51 37 53 32 53 C27 53 23 51 23 46 Z" fill="#ffffff"/>
  <!-- Large, high-contrast C and B, pushed out wide and resting on the hands -->
  <text x="10" y="41" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="29" fill="#ffffff" text-anchor="middle">C</text>
  <text x="54" y="41" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="29" fill="#ffffff" text-anchor="middle">B</text>
</svg>
