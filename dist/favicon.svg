<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cb-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#cb-g)"/>
  <!-- Arms curve DOWN from the shoulder before angling out to the hand,
       staying clear of the letters entirely instead of cutting across them
       (verified by rendering this file and inspecting the actual pixels —
       earlier versions looked fine in coordinates but clipped/crossed in
       the real render). -->
  <g stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" fill="none">
    <path d="M39 54 Q21 66 13 80"/>
    <path d="M61 54 Q79 66 87 80"/>
  </g>
  <circle cx="13" cy="80" r="5" fill="#ffffff"/>
  <circle cx="87" cy="80" r="5" fill="#ffffff"/>
  <circle cx="50" cy="22" r="9" fill="#ffffff"/>
  <path d="M36 78 C36 55 42 46 50 46 C58 46 64 55 64 78 C64 87 58 90 50 90 C42 90 36 87 36 78 Z" fill="#ffffff"/>
  <!-- Large C/B, pushed to the far outside edges and verified (via a
       rendered screenshot against the true SVG bounds) to not clip. -->
  <text x="12" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="43" fill="#ffffff" text-anchor="middle">C</text>
  <text x="88" y="72" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="43" fill="#ffffff" text-anchor="middle">B</text>
</svg>
